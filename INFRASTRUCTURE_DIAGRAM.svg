<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">AI Freelancer Matching Platform infrastructure diagram</title>
  <desc id="desc">Client requests are processed by an AI matching engine, matched to freelancer profiles and availability, and produce recommendations, prices, and invitations.</desc>
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="125%" height="130%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-opacity="0.18"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1f2937"/>
    </marker>
    <style>
      .outer { fill: #ffffff; stroke: #111827; stroke-width: 2; }
      .group { fill: #f8fafc; stroke: #111827; stroke-width: 2; }
      .card { fill: #ffffff; stroke: #111827; stroke-width: 2; }
      .store { fill: #ffffff; stroke: #111827; stroke-width: 2; }
      .arrow { fill: none; stroke: #1f2937; stroke-width: 2.5; marker-end: url(#arrow); }
      .dash { fill: #f8fafc; stroke: #111827; stroke-width: 2; stroke-dasharray: 9 7; }
      text { font-family: Arial, Helvetica, sans-serif; fill: #111827; text-anchor: middle; }
      .heading { font-size: 28px; font-weight: 700; }
      .group-title { font-size: 18px; font-weight: 700; }
      .label { font-size: 16px; font-weight: 700; }
      .small { font-size: 13px; font-weight: 400; }
      .store-label { font-size: 15px; font-weight: 700; }
    </style>
  </defs>

  <rect class="outer" x="15" y="15" width="1170" height="730" rx="0"/>
  <text class="heading" x="600" y="57">AI Freelancer Matching Platform</text>

  <!-- Client request area -->
  <g filter="url(#shadow)">
    <rect class="group" x="50" y="105" width="300" height="310" rx="16"/>
  </g>
  <text class="group-title" x="200" y="143">Client Request Portal</text>
  <rect class="card" x="76" y="170" width="248" height="82" rx="14"/>
  <text class="label" x="200" y="202">Project Request</text>
  <text class="small" x="200" y="225">Problem, skills, language, deadline</text>
  <rect class="card" x="76" y="278" width="248" height="105" rx="14"/>
  <text class="label" x="200" y="310">Client Requirements</text>
  <text class="small" x="200" y="334">Team size, budget, start date</text>
  <text class="small" x="200" y="354">Response urgency</text>

  <!-- Matching area -->
  <g filter="url(#shadow)">
    <rect class="group" x="445" y="105" width="310" height="310" rx="16"/>
  </g>
  <text class="group-title" x="600" y="143">AI Matching Engine</text>
  <rect class="card" x="471" y="170" width="258" height="64" rx="14"/>
  <text class="label" x="600" y="209">Request Analysis</text>
  <rect class="card" x="471" y="252" width="258" height="64" rx="14"/>
  <text class="label" x="600" y="291">Match and Rank</text>
  <rect class="card" x="471" y="334" width="258" height="55" rx="14"/>
  <text class="label" x="600" y="368">Solution and Price Range</text>

  <!-- Freelancer area -->
  <g filter="url(#shadow)">
    <rect class="group" x="850" y="105" width="300" height="310" rx="16"/>
  </g>
  <text class="group-title" x="1000" y="143">Freelancer Portal</text>
  <rect class="card" x="876" y="170" width="248" height="82" rx="14"/>
  <text class="label" x="1000" y="202">Profile Management</text>
  <text class="small" x="1000" y="225">Skills, languages, portfolio, rate</text>
  <rect class="card" x="876" y="278" width="248" height="105" rx="14"/>
  <text class="label" x="1000" y="310">Availability and Response</text>
  <text class="small" x="1000" y="334">Start date, capacity, invite status</text>
  <text class="small" x="1000" y="354">Accept, decline, ask a question</text>

  <!-- Connectors -->
  <path class="arrow" d="M350 260 H435"/>
  <path class="arrow" d="M765 260 H840"/>
  <path class="arrow" d="M850 330 C805 330 800 360 755 360"/>
  <path class="arrow" d="M445 330 C400 330 395 360 350 360"/>

  <!-- Data layer -->
  <rect class="dash" x="50" y="500" width="1100" height="190" rx="16"/>
  <text class="group-title" x="600" y="535">Local Data Layer</text>
  <text class="small" x="600" y="558">SQLite database file - freelancer data, client requests, matches, and responses</text>

  <g>
    <ellipse class="store" cx="180" cy="594" rx="88" ry="17"/>
    <path class="store" d="M92 594 V652 C92 675 268 675 268 652 V594"/>
    <path d="M92 652 C92 675 268 675 268 652" fill="none" stroke="#111827" stroke-width="2"/>
    <text class="store-label" x="180" y="620">Freelancer Profiles</text>
    <text class="small" x="180" y="641">skills and rates</text>
  </g>
  <g>
    <ellipse class="store" cx="430" cy="594" rx="88" ry="17"/>
    <path class="store" d="M342 594 V652 C342 675 518 675 518 652 V594"/>
    <path d="M342 652 C342 675 518 675 518 652" fill="none" stroke="#111827" stroke-width="2"/>
    <text class="store-label" x="430" y="620">Availability</text>
    <text class="small" x="430" y="641">start date and capacity</text>
  </g>
  <g>
    <ellipse class="store" cx="680" cy="594" rx="88" ry="17"/>
    <path class="store" d="M592 594 V652 C592 675 768 675 768 652 V594"/>
    <path d="M592 652 C592 675 768 675 768 652" fill="none" stroke="#111827" stroke-width="2"/>
    <text class="store-label" x="680" y="620">Client Requests</text>
    <text class="small" x="680" y="641">problem and criteria</text>
  </g>
  <g>
    <ellipse class="store" cx="930" cy="594" rx="88" ry="17"/>
    <path class="store" d="M842 594 V652 C842 675 1018 675 1018 652 V594"/>
    <path d="M842 652 C842 675 1018 675 1018 652" fill="none" stroke="#111827" stroke-width="2"/>
    <text class="store-label" x="930" y="620">Matches and Responses</text>
    <text class="small" x="930" y="641">ranking and invitation status</text>
  </g>

  <!-- Data arrows -->
  <path class="arrow" d="M200 415 C200 455 430 458 430 570"/>
  <path class="arrow" d="M600 415 V570"/>
  <path class="arrow" d="M1000 415 C1000 455 930 458 930 570"/>
</svg>
