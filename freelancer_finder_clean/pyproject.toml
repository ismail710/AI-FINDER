[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "freelancer-finder"
version = "0.1.0"
description = "Evidence-grounded freelancer matching with embeddings and SQLite"
requires-python = ">=3.11"
dependencies = [
  "langchain>=1.0.0",
  "langchain-community>=0.3.0",
  "langchain-huggingface>=1.2.2",
  "langchain-ollama>=1.1.0",
  "python-dotenv>=1.0.1",
  "huggingface-hub>=0.30.0",
  "SQLAlchemy>=2.0.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"freelancer_finder.web" = ["static/*.html"]

